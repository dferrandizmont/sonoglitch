# F-Droid build recipe for Sonoglitch. It is submitted to the fdroiddata
# repository (https://gitlab.com/fdroid/fdroiddata) as
# metadata/es.sonoglitch.app.yml; see docs/RELEASING.md.
# Title, summary, description, changelogs and images come from
# fastlane/metadata/android in this repository.

Categories:
  - Graphics
License: Apache-2.0
SourceCode: https://github.com/dferrandizmont/sonoglitch
IssueTracker: https://github.com/dferrandizmont/sonoglitch/issues
Changelog: https://github.com/dferrandizmont/sonoglitch/blob/HEAD/CHANGELOG.md
Donate: https://ko-fi.com/danielmfdev

AutoName: Sonoglitch

RepoType: git
Repo: https://github.com/dferrandizmont/sonoglitch.git

Builds:
  - versionName: 0.2.0
    versionCode: 23
    commit: v0.2.0-alpha.3
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.7
    ndk: 28.2.13676358
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $flutter$/bin/flutter config --no-analytics
      - $flutter$/bin/flutter precache --android
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache/hosted/pub.dev/jni-1.1.0/java/gradle/wrapper/gradle-wrapper.jar
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --no-pub --target-platform=android-arm64,android-x64 --build-name=0.2.0 --build-number=23 --dart-define=APP_VERSION=0.2.0-alpha.3 --dart-define=DONATION_URL=https://ko-fi.com/danielmfdev

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 0.1.0
CurrentVersionCode: 14
