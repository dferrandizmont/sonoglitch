name: Feature request
description: Suggest an improvement to Sonoglitch.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want to solve and how your proposal fits an offline, privacy-first camera app.
        Do not include private information in this public issue.
  - type: input
    id: device
    attributes:
      label: Device
      description: Manufacturer and model.
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Find the version in Settings, under About.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how the feature should work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include any existing workaround.
