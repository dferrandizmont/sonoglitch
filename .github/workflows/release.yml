name: Release APK

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tag and derive version
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo '::error::Use a version tag such as v0.1.0-alpha.1 or v0.1.0.'
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-alpha* || "$version" == *-beta* || "$version" == *-rc* ]]; then
            prerelease=true
          fi
          printf 'version=%s\nprerelease=%s\n' "$version" "$prerelease" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get

      # The release is only built from a commit that passes the project checks.
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

      - name: Build release APK
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64,android-x64 \
            --build-name="${APP_VERSION%%-*}" \
            --dart-define="APP_VERSION=$APP_VERSION" \
            --dart-define="DONATION_URL=https://ko-fi.com/danielmfdev"

      # The APK is signed in a separate job that runs no third-party actions,
      # so signing secrets never share a job with third-party code.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      signing: ${{ steps.sign.outputs.signing }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk
          path: unsigned

      # Gradle uses the debug key for release builds; replace that signature here.
      - name: Sign and verify APK
        id: sign
        env:
          APP_VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p dist
          apk="dist/sonoglitch-$APP_VERSION.apk"
          built_apk=unsigned/app-release.apk
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" || ! -d "$sdk_root/build-tools" ]]; then
            echo '::error::Android SDK build tools are unavailable.'
            exit 1
          fi
          build_tools="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [[ ! -x "$build_tools/apksigner" || ! -x "$build_tools/zipalign" ]]; then
            echo '::error::apksigner or zipalign is unavailable.'
            exit 1
          fi

          configured=0
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -n "${!secret_name}" ]]; then
              configured=$((configured + 1))
            fi
          done
          if [[ "$configured" -eq 0 ]]; then
            if [[ "$PRERELEASE" != true ]]; then
              echo '::error::Stable releases require the four signing secrets.'
              exit 1
            fi
            cp "$built_apk" "$apk"
            echo 'signing=debug' >> "$GITHUB_OUTPUT"
            echo '::warning::No signing secrets configured; this APK uses the debug key.'
            printf '### APK signing warning\n\nNo signing secrets are configured. This APK uses the debug key and is intended for testing only.\n' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$configured" -ne 4 ]]; then
            echo '::error::Configure all four Android signing secrets, or none. Partial configuration is not allowed.'
            exit 1
          else
            keystore="$(mktemp "$RUNNER_TEMP/sonoglitch-key-XXXXXX")"
            aligned_apk="$(mktemp "$RUNNER_TEMP/sonoglitch-aligned-XXXXXX.apk")"
            trap 'rm -f -- "$keystore" "$aligned_apk"' EXIT
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            "$build_tools/zipalign" -f -P 16 4 "$built_apk" "$aligned_apk"
            "$build_tools/apksigner" sign \
              --ks "$keystore" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$apk" "$aligned_apk"
            echo 'signing=repository-keystore' >> "$GITHUB_OUTPUT"
            printf '### APK signing\n\nAPK signed with the configured repository keystore.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          "$build_tools/zipalign" -c -P 16 4 "$apk"
          "$build_tools/apksigner" verify "$apk"

      - name: Compute SHA-256
        env:
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum "sonoglitch-$APP_VERSION.apk" > "sonoglitch-$APP_VERSION.apk.sha256"
          sha256sum --check "sonoglitch-$APP_VERSION.apk.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: |
            dist/*.apk
            dist/*.apk.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apk
          path: dist

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          SIGNING: ${{ needs.sign.outputs.signing }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check "sonoglitch-$APP_VERSION.apk.sha256")
          notes="$RUNNER_TEMP/sonoglitch-release-notes.md"
          if [[ "$SIGNING" == debug ]]; then
            printf '**Signing warning:** This APK uses the debug key and is intended for testing only.\n' > "$notes"
            printf '### APK signing warning\n\nPublished APK uses the debug key because signing secrets were not configured.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'APK signed with the configured repository keystore.\n' > "$notes"
          fi
          args=(--verify-tag --title "Sonoglitch $APP_VERSION" --generate-notes --notes-file "$notes")
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "${args[@]}" \
            "dist/sonoglitch-$APP_VERSION.apk" \
            "dist/sonoglitch-$APP_VERSION.apk.sha256"
