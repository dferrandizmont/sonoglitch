<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Sonoglitch</title>
  <desc>A violet camera lens torn into displaced horizontal colour channels by sound.</desc>
  <defs>
    <g id="lens" fill="none">
      <circle cx="512" cy="512" r="274" stroke-width="70"/>
      <circle cx="512" cy="512" r="130" stroke-width="22"/>
    </g>
    <clipPath id="left"><rect x="0" y="0" width="512" height="1024"/></clipPath>
    <clipPath id="slice-1"><rect x="512" y="200" width="400" height="100"/></clipPath>
    <clipPath id="slice-2"><rect x="512" y="316" width="400" height="76"/></clipPath>
    <clipPath id="slice-3"><rect x="512" y="408" width="400" height="76"/></clipPath>
    <clipPath id="slice-4"><rect x="512" y="500" width="400" height="76"/></clipPath>
    <clipPath id="slice-5"><rect x="512" y="592" width="400" height="76"/></clipPath>
    <clipPath id="slice-6"><rect x="512" y="684" width="400" height="76"/></clipPath>
    <clipPath id="slice-7"><rect x="512" y="776" width="400" height="64"/></clipPath>
  </defs>
  <rect id="background" width="1024" height="1024" fill="#120E1F"/>
  <g id="artwork">
    <g clip-path="url(#left)"><use href="#lens" stroke="#B9A6FF"/></g>
    <g transform="translate(12 0)">
      <g clip-path="url(#slice-1)">
        <use href="#lens" x="-10" stroke="#55E5F2"/>
        <use href="#lens" x="10" stroke="#F36CCB"/>
        <use href="#lens" stroke="#B9A6FF"/>
      </g>
    </g>
    <g transform="translate(-8 0)">
      <g clip-path="url(#slice-2)">
        <use href="#lens" x="-10" stroke="#55E5F2"/>
        <use href="#lens" x="10" stroke="#F36CCB"/>
        <use href="#lens" stroke="#B9A6FF"/>
      </g>
    </g>
    <g transform="translate(26 0)">
      <g clip-path="url(#slice-3)">
        <use href="#lens" x="-10" stroke="#55E5F2"/>
        <use href="#lens" x="10" stroke="#FFB784"/>
        <use href="#lens" stroke="#B9A6FF"/>
      </g>
    </g>
    <g transform="translate(42 0)">
      <g clip-path="url(#slice-4)">
        <use href="#lens" x="-10" stroke="#55E5F2"/>
        <use href="#lens" x="10" stroke="#F36CCB"/>
        <use href="#lens" stroke="#B9A6FF"/>
      </g>
    </g>
    <g transform="translate(14 0)">
      <g clip-path="url(#slice-5)">
        <use href="#lens" x="-10" stroke="#55E5F2"/>
        <use href="#lens" x="10" stroke="#F36CCB"/>
        <use href="#lens" stroke="#B9A6FF"/>
      </g>
    </g>
    <g transform="translate(-18 0)">
      <g clip-path="url(#slice-6)">
        <use href="#lens" x="-10" stroke="#55E5F2"/>
        <use href="#lens" x="10" stroke="#FFB784"/>
        <use href="#lens" stroke="#B9A6FF"/>
      </g>
    </g>
    <g transform="translate(8 0)">
      <g clip-path="url(#slice-7)">
        <use href="#lens" x="-10" stroke="#55E5F2"/>
        <use href="#lens" x="10" stroke="#F36CCB"/>
        <use href="#lens" stroke="#B9A6FF"/>
      </g>
    </g>
  </g>
</svg>
